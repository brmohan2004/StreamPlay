name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd streamplay
          flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          cd streamplay
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd streamplay
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r StreamPlay.ipa Payload
          mv StreamPlay.ipa ../StreamPlay.ipa

      - name: Upload StreamPlay IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamPlay.ipa
          path: StreamPlay.ipa
          retention-days: 14
